<div>
    <mat-checkbox *ngIf="typeControl == 'model'"
    [checked]="controlModel"
    (change)="onModelChange($event.checked, $event.source)"
    class="custom-checkbox"
    [disabled]="isDisabled">
        {{ label ? label : ''}}
    </mat-checkbox>

    <mat-checkbox *ngIf="typeControl == 'form'" [formControl]="control" class="custom-checkbox">
        {{ label ? label : ''}}
    </mat-checkbox>
</div>
